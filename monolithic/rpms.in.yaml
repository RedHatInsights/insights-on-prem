contentOrigin:
  repofiles: ["./redhat.repo"]
context:
  image: registry.redhat.io/ubi9-minimal:latest
packages:
  # Required by maturin to build Rust-based Python extensions from source
  # (pydantic-core, uvloop, watchfiles)
  - rust
  - cargo
  # C/C++ compilers + headers, required to build C/C++ extensions from source
  # (httptools, greenlet, and other sdists). The base image ships python3.12
  # (not the RHEL9 default python3/3.9), so we need python3.12-devel to match
  # the venv's headers, not python3-devel.
  - gcc
  - gcc-c++
  - python3.12-devel
  # sqlite3 CLI / headers
  - sqlite
  # Provides pg_config, required to build psycopg2-binary from source
  - postgresql-devel
arches:
  - x86_64
