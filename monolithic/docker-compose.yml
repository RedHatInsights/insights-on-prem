version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: insights-postgres
    environment:
      POSTGRES_DB: insights
      POSTGRES_USER: insights
      POSTGRES_PASSWORD: insights
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insights"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - insights-network

  app:
    #image: localhost/insights-on-prem-monolithic:latest
    #image: localhost/monolithic_app:latest_more_ins_fixes
    build:
      context: .
      dockerfile: Dockerfile
    container_name: insights-app
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: insights
      POSTGRES_USER: insights
      POSTGRES_PASSWORD: insights
      MAX_FILE_SIZE: 104857600
      TEMP_UPLOAD_DIR: /tmp/insights-uploads
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
      - ./tests:/app/tests
      - ./config.yml:/app/config.yml
      - temp_uploads:/tmp/insights-uploads
      # Patched upstream libraries for memory leak testing
      - /Users/mzibrick/Projects/RH-ccx/insights-core/insights:/opt/venv/lib64/python3.12/site-packages/insights
      - /Users/mzibrick/Projects/RH-ccx/ccx-ocp-core/ccx_ocp_core:/opt/venv/lib64/python3.12/site-packages/ccx_ocp_core
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - insights-network
    mem_limit: 4g
    cpus: "1.0"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  temp_uploads:

networks:
  insights-network:
    driver: bridge
