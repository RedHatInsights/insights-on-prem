# ConfigurationPolicy applied directly to the cluster namespace the governance agent watches.
# Sets CCX_SERVER and POLL_INTERVAL on insights-client via a patch Job in the addon template.
#
# NOTE: Direct deployment patching via ConfigurationPolicy hits immutable field constraints.
# Instead this is handled via a Job in 04-addon-template.yaml that runs oc set env.
# This file documents the intent and can be used for compliance checking only (inform mode).
apiVersion: policy.open-cluster-management.io/v1
kind: ConfigurationPolicy
metadata:
  name: insights-on-prem-client-config
  namespace: lsolraov-cluster
spec:
  remediationAction: inform
  severity: medium
  object-templates:
    - complianceType: MustHave
      objectDefinition:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: insights-config
          namespace: openshift-insights
        data:
          config.yaml: |
            dataReporting:
              uploadEndpoint: http://insights-on-prem.insights-on-prem-poc.svc.cluster.local:8000/api/ingress/v1/upload
              downloadEndpoint: http://insights-on-prem.insights-on-prem-poc.svc.cluster.local:8000/api/v2/cluster/%s/reports
              interval: 0h1m0s
