apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: insights-on-prem-hub-config
  namespace: insights-on-prem-poc
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    # --- Pause MCH operator ---
    # Prevents MCH from reverting our changes to insights-client and console.
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: insights-on-prem-mch-pause
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: operator.open-cluster-management.io/v1
                kind: MultiClusterHub
                metadata:
                  name: multiclusterhub
                  namespace: open-cluster-management
                  annotations:
                    mch-pause: "true"

    # --- Configure insights-client ---
    # Route insights-client through the spoke proxy instead of console.redhat.com.
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: insights-on-prem-insights-client
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: insights-client
                  namespace: open-cluster-management
                spec:
                  template:
                    spec:
                      containers:
                        - name: client
                          env:
                            - name: CCX_SERVER
                              value: "https://insights-operator-proxy.openshift-insights.svc.cluster.local:8443/api/v2"
                            - name: SSL_CERT_DIR
                              value: "/service-ca"
                            - name: POLL_INTERVAL
                              value: "1"
                          volumeMounts:
                            - name: service-ca
                              mountPath: /service-ca
                              readOnly: true
                      volumes:
                        - name: service-ca
                          configMap:
                            name: insights-on-prem-proxy-ca

    # --- CONNECT proxy for console upgrade-risks requests ---
    # The console's getDefaultAgent() sets an explicit `ca` that excludes
    # NODE_EXTRA_CA_CERTS (see docs/console-ca-issue.md).  When HTTPS_PROXY
    # is set, the code uses HttpsProxyAgent instead, which has no explicit
    # `ca` and therefore honours NODE_EXTRA_CA_CERTS for the target TLS
    # handshake.  The proxy is restricted to the insights-operator-proxy
    # host and is only reachable inside the cluster (ClusterIP).
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: insights-on-prem-connect-proxy
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: insights-on-prem-connect-proxy
                  namespace: open-cluster-management
                data:
                  proxy.mjs: |
                    import { createServer } from "node:http";
                    import { connect } from "node:net";
                    const ALLOWED = "insights-operator-proxy.openshift-insights.svc";
                    const ALLOWED_PORT = 8443;
                    const server = createServer((_req, res) => { res.writeHead(405); res.end(); });
                    server.on("connect", (req, cltSocket, head) => {
                      const [host, port] = req.url.split(":");
                      if (host !== ALLOWED || (parseInt(port) || 443) !== ALLOWED_PORT) {
                        cltSocket.write("HTTP/1.1 403 Forbidden\r\n\r\n");
                        cltSocket.end();
                        return;
                      }
                      let established = false;
                      cltSocket.on("error", () => { cltSocket.destroy(); });
                      const srv = connect(ALLOWED_PORT, host, () => {
                        established = true;
                        cltSocket.write("HTTP/1.1 200 Connection Established\r\n\r\n");
                        srv.write(head);
                        srv.pipe(cltSocket);
                        cltSocket.pipe(srv);
                      });
                      srv.on("error", () => {
                        if (!established) cltSocket.write("HTTP/1.1 502 Bad Gateway\r\n\r\n");
                        cltSocket.destroy();
                      });
                    });
                    server.listen(3128, () => console.log("connect-proxy listening on :3128"));
            - complianceType: musthave
              objectDefinition:
                apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: insights-on-prem-connect-proxy
                  namespace: open-cluster-management
                  labels:
                    app: insights-on-prem-connect-proxy
                spec:
                  replicas: 1
                  selector:
                    matchLabels:
                      app: insights-on-prem-connect-proxy
                  template:
                    metadata:
                      labels:
                        app: insights-on-prem-connect-proxy
                    spec:
                      containers:
                        - name: proxy
                          image: registry.access.redhat.com/ubi9/nodejs-22-minimal@sha256:3ad547d444d597c68235bbb0e31dce0d1c0fa3f67c5c92474b7b3a05782b5a79
                          command: ["node", "/config/proxy.mjs"]
                          ports:
                            - containerPort: 3128
                          volumeMounts:
                            - name: script
                              mountPath: /config
                              readOnly: true
                          readinessProbe:
                            tcpSocket:
                              port: 3128
                            initialDelaySeconds: 2
                          livenessProbe:
                            tcpSocket:
                              port: 3128
                            initialDelaySeconds: 5
                          resources:
                            requests:
                              cpu: 1m
                              memory: 16Mi
                            limits:
                              memory: 32Mi
                          securityContext:
                            allowPrivilegeEscalation: false
                            capabilities:
                              drop: ["ALL"]
                            runAsNonRoot: true
                            readOnlyRootFilesystem: true
                            seccompProfile:
                              type: RuntimeDefault
                      volumes:
                        - name: script
                          configMap:
                            name: insights-on-prem-connect-proxy
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Service
                metadata:
                  name: insights-on-prem-connect-proxy
                  namespace: open-cluster-management
                  labels:
                    app: insights-on-prem-connect-proxy
                spec:
                  selector:
                    app: insights-on-prem-connect-proxy
                  ports:
                    - port: 3128
                      targetPort: 3128

    # --- Configure ACM console for URP ---
    # Point upgrade risk predictions to the on-prem service via the spoke proxy.
    # HTTPS_PROXY makes the upgrade-risks code path use HttpsProxyAgent
    # (which honours NODE_EXTRA_CA_CERTS) instead of getDefaultAgent().
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: insights-on-prem-console-config
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: console-chart-console-v2
                  namespace: open-cluster-management
                spec:
                  template:
                    spec:
                      containers:
                        - name: console
                          env:
                            - name: UPGRADE_RISKS_PREDICTION_URL
                              value: "https://insights-operator-proxy.openshift-insights.svc:8443/api/insights-results-aggregator/v2/upgrade-risks-prediction"
                            - name: NODE_EXTRA_CA_CERTS
                              value: "/service-ca/service-ca.crt"
                            - name: HTTPS_PROXY
                              value: "http://insights-on-prem-connect-proxy.open-cluster-management.svc:3128"
                          volumeMounts:
                            - name: service-ca
                              mountPath: /service-ca
                              readOnly: true
                      volumes:
                        - name: service-ca
                          configMap:
                            name: insights-on-prem-proxy-ca
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: insights-on-prem-hub-config
  namespace: insights-on-prem-poc
placementRef:
  name: insights-on-prem-hub-only
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
subjects:
  - name: insights-on-prem-hub-config
    apiGroup: policy.open-cluster-management.io
    kind: Policy
