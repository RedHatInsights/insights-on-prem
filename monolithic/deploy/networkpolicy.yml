# Restrict who can reach PostgreSQL on 5432.
# Requires a CNI that enforces NetworkPolicy (e.g. OVN-Kubernetes on OpenShift).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: insights-postgres-ingress
spec:
  podSelector:
    matchLabels:
      app: insights-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: insights-on-prem
      ports:
        - protocol: TCP
          port: 5432
