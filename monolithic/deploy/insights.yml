apiVersion: apps/v1
kind: Deployment
metadata:
  name: insights-on-prem
spec:
  replicas: 1
  template:
    metadata:
      name: insights-on-prem
      labels:
        app: insights-on-prem
    spec:
      serviceAccountName: insights-on-prem
      containers:
      - name: insights-on-prem
        image: quay.io/jipapous/insights-on-prem-poc:latest
        command: ["python", "-m", "app.main"]
        ports:
        - containerPort: 8443
          name: https
          protocol: TCP
        volumeMounts:
        - name: tls
          mountPath: /tls
        env:
        - name: MTLS_ENABLED
          value: "true"
        - name: POSTGRES_HOST
          value: "insights-postgres"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: insights-postgres
              key: database-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: insights-postgres
              key: database-password
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: insights-postgres
              key: database-name
      volumes:
      - name: tls
        emptyDir: {}
      imagePullSecrets:
      - name: jipapous-insights-on-prem-pull-secret
  selector:
    matchLabels:
      app: insights-on-prem
