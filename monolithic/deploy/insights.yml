apiVersion: apps/v1
kind: Deployment
metadata:
  name: insights-on-prem
spec:
  replicas: 1
  template:
    metadata:
      name: insights-on-prem
      labels:
        app: insights-on-prem
    spec:
      serviceAccountName: insights-on-prem
      containers:
      - name: insights-on-prem
        image: quay.io/jipapous/insights-on-prem-poc:latest
        command: ["sh", "-c",
          "python -m app.services.server_cert && uvicorn app.main:app --host 0.0.0.0 --port 8443 --ssl-keyfile /tls/tls.key --ssl-certfile /tls/tls.crt $([ \"$MTLS_ENABLED\" = 'true' ] && [ -f /mtls-ca/tls.crt ] && echo '--ssl-ca-certs /mtls-ca/tls.crt --ssl-cert-reqs 2')"]
        ports:
        - containerPort: 8443
          name: https
          protocol: TCP
        volumeMounts:
        - name: tls
          mountPath: /tls
        - name: client-ca
          mountPath: /mtls-ca
          readOnly: true
        env:
        - name: MTLS_ENABLED
          value: "true"
        - name: POSTGRES_HOST
          value: "insights-postgres"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: insights-postgres
              key: database-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: insights-postgres
              key: database-password
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: insights-postgres
              key: database-name
      volumes:
      - name: tls
        emptyDir: {}
      - name: client-ca
        secret:
          secretName: insights-operator-proxy-ca
          optional: true
      imagePullSecrets:
      - name: jipapous-insights-on-prem-pull-secret
  selector:
    matchLabels:
      app: insights-on-prem
