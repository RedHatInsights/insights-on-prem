apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: insights-on-prem-spoke-policy
  namespace: insights-on-prem-poc
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    # --- Skupper operator on spoke ---
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: insights-skupper-operator
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1alpha1
                kind: Subscription
                metadata:
                  name: skupper-operator
                  namespace: openshift-operators
                spec:
                  channel: stable-2
                  name: skupper-operator
                  source: redhat-operators
                  sourceNamespace: openshift-marketplace

    # --- Skupper Site on spoke ---
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: insights-skupper-site
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: skupper.io/v2alpha1
                kind: Site
                metadata:
                  name: insights-on-prem
                  namespace: openshift-insights

    # --- Distribute Skupper token code to spokes (sensitive) ---
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: insights-skupper-token-secret
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: insights-on-prem-skupper-code
                  namespace: openshift-insights
                type: Opaque
                data:
                  code: '{{hub fromSecret "insights-on-prem-poc" "insights-on-prem-skupper-code" "code" hub}}'

    # --- Skupper AccessToken (links spoke to hub) ---
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: insights-skupper-access-token
        spec:
          remediationAction: enforce
          severity: medium
          object-templates-raw: |
            {{- $code := (lookup "v1" "Secret" "openshift-insights" "insights-on-prem-skupper-code") }}
            {{- if $code.data }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: skupper.io/v2alpha1
                kind: AccessToken
                metadata:
                  name: insights-on-prem-hub
                  namespace: openshift-insights
                spec:
                  url: '{{hub fromConfigMap "insights-on-prem-poc" "insights-on-prem-skupper-token" "url" hub}}'
                  code: {{ index $code.data "code" | base64dec }}
                  ca: |
                    {{hub fromConfigMap "insights-on-prem-poc" "insights-on-prem-skupper-token" "ca" | autoindent hub}}
            {{- end }}

    # --- Skupper Listener (creates local Service for IO) ---
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: insights-skupper-listener
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: skupper.io/v2alpha1
                kind: Listener
                metadata:
                  name: insights-on-prem
                  namespace: openshift-insights
                spec:
                  routingKey: insights-on-prem
                  host: insights-on-prem
                  port: 8443
                  tlsCredentials: insights-on-prem-tls

    # --- Service annotation for TLS cert generation by service-ca ---
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: insights-skupper-service-tls
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Service
                metadata:
                  name: insights-on-prem
                  namespace: openshift-insights
                  annotations:
                    service.beta.openshift.io/serving-cert-secret-name: insights-on-prem-serving-cert

    # --- Assemble full TLS bundle for Skupper (cert + key + CA) ---
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: insights-skupper-tls-bundle
        spec:
          remediationAction: enforce
          severity: medium
          object-templates-raw: |
            {{- $cert := (lookup "v1" "Secret" "openshift-insights" "insights-on-prem-serving-cert") }}
            {{- $ca := fromConfigMap "openshift-insights" "service-ca-bundle" "service-ca.crt" }}
            {{- if $cert.data }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: insights-on-prem-tls
                  namespace: openshift-insights
                type: kubernetes.io/tls
                data:
                  tls.crt: '{{ index $cert.data "tls.crt" }}'
                  tls.key: '{{ index $cert.data "tls.key" }}'
                  ca.crt: '{{ $ca | base64enc }}'
            {{- end }}

    # --- Service CA trust (IO trusts the Skupper Listener's serving cert) ---
    # Merges the spoke's service-ca into the existing Proxy trustedCA ConfigMap
    # (if one exists) instead of overriding the reference. If no trustedCA is
    # configured, creates a new ConfigMap and sets the Proxy reference.
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: insights-on-prem-spoke-policy-service-ca-trust
        spec:
          remediationAction: enforce
          severity: medium
          object-templates-raw: |
            {{- $ourCA := fromConfigMap "openshift-insights" "service-ca-bundle" "service-ca.crt" }}
            {{- $proxy := (lookup "config.openshift.io/v1" "Proxy" "" "cluster") }}
            {{- $cmName := $proxy.spec.trustedCA.name | default "" }}
            {{- if ne $cmName "" }}
              {{- $existing := fromConfigMap "openshift-config" $cmName "ca-bundle.crt" | default "" }}
              {{- if not (contains $ourCA $existing) }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: '{{ $cmName }}'
                  namespace: openshift-config
                data:
                  ca-bundle.crt: |
                    {{ $existing | autoindent }}
                    {{ $ourCA | autoindent }}
              {{- end }}
            {{- else if eq $cmName "" }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: insights-on-prem-service-ca
                  namespace: openshift-config
                data:
                  ca-bundle.crt: |
                    {{ $ourCA | autoindent }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: config.openshift.io/v1
                kind: Proxy
                metadata:
                  name: cluster
                spec:
                  trustedCA:
                    name: insights-on-prem-service-ca
            {{- end }}

    # --- Insights Operator configuration ---
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: insights-on-prem-spoke-policy-operator-config
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: insights-config
                  namespace: openshift-insights
                data:
                  config.yaml: |
                    dataReporting:
                      uploadEndpoint: https://insights-on-prem.openshift-insights.svc:8443/api/ingress/v1/upload
                      downloadEndpoint: https://insights-on-prem.openshift-insights.svc:8443/api/v2/cluster/%s/reports
                      downloadEndpointTechPreview: https://insights-on-prem.openshift-insights.svc:8443/api/v2/cluster/%s/request/%s/report
                      processingStatusEndpoint: https://insights-on-prem.openshift-insights.svc:8443/api/v2/cluster/%s/request/%s/status
                      interval: 0h1m0s
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: insights-on-prem-spoke-policy
  namespace: insights-on-prem-poc
placementRef:
  name: all-managed-clusters
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
subjects:
  - name: insights-on-prem-spoke-policy
    apiGroup: policy.open-cluster-management.io
    kind: Policy
