# cert-manager operator installation
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager-operator
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: cert-manager-operator
  namespace: cert-manager-operator
spec:
  targetNamespaces:
    - cert-manager-operator
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: openshift-cert-manager-operator
  namespace: cert-manager-operator
spec:
  channel: stable-v1
  name: openshift-cert-manager-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
---
# Hub-side Policy: create all cert-manager resources (CAs, issuers, server cert)
# and sync server CA to ConfigMap for spoke distribution.
# Runs on the hub (local-cluster). If cert-manager CRDs don't exist yet,
# the Policy stays NonCompliant and retries automatically.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: insights-on-prem-hub-certs
  namespace: insights-on-prem-poc
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    # --- Bootstrap self-signed issuer ---
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: insights-on-prem-bootstrap-issuer
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: cert-manager.io/v1
                kind: ClusterIssuer
                metadata:
                  name: selfsigned-bootstrap
                spec:
                  selfSigned: {}

    # --- Server and client CA certificates ---
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: insights-on-prem-ca-certs
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: cert-manager.io/v1
                kind: Certificate
                metadata:
                  name: insights-on-prem-server-ca
                  namespace: insights-on-prem-poc
                spec:
                  isCA: true
                  secretName: insights-on-prem-server-ca
                  commonName: insights-on-prem-server-ca
                  duration: 87600h
                  renewBefore: 8760h
                  privateKey:
                    algorithm: RSA
                    size: 4096
                  issuerRef:
                    name: selfsigned-bootstrap
                    kind: ClusterIssuer
            - complianceType: musthave
              objectDefinition:
                apiVersion: cert-manager.io/v1
                kind: Certificate
                metadata:
                  name: insights-on-prem-client-ca
                  namespace: insights-on-prem-poc
                spec:
                  isCA: true
                  secretName: insights-on-prem-client-ca
                  commonName: insights-on-prem-client-ca
                  duration: 87600h
                  renewBefore: 8760h
                  privateKey:
                    algorithm: RSA
                    size: 4096
                  issuerRef:
                    name: selfsigned-bootstrap
                    kind: ClusterIssuer

    # --- Issuer that uses the server CA to sign leaf certs ---
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: insights-on-prem-server-issuer
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: cert-manager.io/v1
                kind: Issuer
                metadata:
                  name: insights-on-prem-server-issuer
                  namespace: insights-on-prem-poc
                spec:
                  ca:
                    secretName: insights-on-prem-server-ca

    # --- Server leaf certificate with dynamic Route hostname SAN ---
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: insights-on-prem-server-cert
        spec:
          remediationAction: enforce
          severity: medium
          object-templates-raw: |
            - complianceType: musthave
              objectDefinition:
                apiVersion: cert-manager.io/v1
                kind: Certificate
                metadata:
                  name: insights-on-prem-server-cert
                  namespace: insights-on-prem-poc
                spec:
                  secretName: insights-on-prem-server-tls
                  duration: 8760h
                  renewBefore: 720h
                  commonName: insights-on-prem.insights-on-prem-poc.svc
                  dnsNames:
                    - insights-on-prem.insights-on-prem-poc.svc
                    - insights-on-prem.insights-on-prem-poc.svc.cluster.local
                    - {{ (lookup "route.openshift.io/v1" "Route" "insights-on-prem-poc" "insights-on-prem").spec.host }}
                  privateKey:
                    algorithm: RSA
                    size: 2048
                  usages:
                    - server auth
                  issuerRef:
                    name: insights-on-prem-server-issuer
                    kind: Issuer

    # --- Trigger rolling restart on cert renewal ---
    # When cert-manager renews the server certificate, the Secret content
    # changes. This policy patches the Deployment's pod template annotation
    # with the cert's hash, triggering a rolling update. Kubernetes creates
    # a new pod with the fresh cert, waits for it to be ready, then sends
    # SIGTERM to the old pod (which drains background tasks before exiting).
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: insights-on-prem-cert-rollout
        spec:
          remediationAction: enforce
          severity: medium
          object-templates-raw: |
            {{- $secret := (lookup "v1" "Secret" "insights-on-prem-poc" "insights-on-prem-server-tls") }}
            {{- if $secret.data }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: insights-on-prem
                  namespace: insights-on-prem-poc
                spec:
                  template:
                    metadata:
                      annotations:
                        cert-hash: '{{ index $secret.data "tls.crt" | base64dec | sha256sum }}'
            {{- end }}

    # --- Sync server CA to ConfigMap for spoke distribution ---
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: insights-on-prem-ca-sync
        spec:
          remediationAction: enforce
          severity: medium
          object-templates-raw: |
            {{- $ca := (lookup "v1" "Secret" "insights-on-prem-poc" "insights-on-prem-server-ca") }}
            {{- if $ca.data }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: insights-on-prem-service-ca
                  namespace: insights-on-prem-poc
                data:
                  ca-bundle.crt: |
                    {{ index $ca.data "tls.crt" | base64dec | autoindent }}
            {{- end }}
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: insights-on-prem-hub-only
  namespace: insights-on-prem-poc
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            local-cluster: "true"
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: insights-on-prem-hub-certs
  namespace: insights-on-prem-poc
placementRef:
  name: insights-on-prem-hub-only
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
subjects:
  - name: insights-on-prem-hub-certs
    apiGroup: policy.open-cluster-management.io
    kind: Policy
