apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: insights-on-prem-hub-config
  namespace: insights-on-prem
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    # --- Configure insights-client and console via MCH overrides ---
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: insights-on-prem-mch-overrides
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: operator.open-cluster-management.io/v1
                kind: MultiClusterHub
                metadata:
                  name: multiclusterhub
                  namespace: open-cluster-management
                spec:
                  overrides:
                    components:
                      - name: insights
                        enabled: true
                        configOverrides:
                          deployments:
                            - name: insights-client
                              containers:
                                - name: client
                                  env:
                                    - name: CCX_SERVER
                                      value: "https://insights-operator-proxy.openshift-insights.svc.cluster.local:8443/api/v2"
                                    - name: SSL_CERT_DIR
                                      value: "/var/run/secrets/kubernetes.io/serviceaccount"
                                    - name: POLL_INTERVAL
                                      value: "1"
                      - name: console
                        enabled: true
                        configOverrides:
                          deployments:
                            - name: console-chart-console-v2
                              containers:
                                - name: console
                                  env:
                                    - name: NODE_EXTRA_CA_CERTS
                                      value: "/var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt"
                                    - name: HTTPS_PROXY
                                      value: "http://insights-on-prem-connect-proxy.open-cluster-management.svc:3128"

    # --- CONNECT proxy for console upgrade-risks requests ---
    # The console's getDefaultAgent() sets an explicit `ca` that excludes
    # NODE_EXTRA_CA_CERTS (see docs/console-ca-issue.md).  When HTTPS_PROXY
    # is set, the code uses HttpsProxyAgent instead, which has no explicit
    # `ca` and therefore honours NODE_EXTRA_CA_CERTS for the target TLS
    # handshake.  The proxy is restricted to the insights-operator-proxy
    # host and is only reachable inside the cluster (ClusterIP).
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: insights-on-prem-connect-proxy
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: insights-on-prem-connect-proxy
                  namespace: open-cluster-management
                data:
                  proxy.mjs: |
                    import { createServer } from "node:http";
                    import { connect } from "node:net";
                    const ALLOWED = "insights-operator-proxy.openshift-insights.svc";
                    const ALLOWED_PORT = 8443;
                    const server = createServer((_req, res) => { res.writeHead(405); res.end(); });
                    server.on("connect", (req, cltSocket, head) => {
                      const [host, port] = req.url.split(":");
                      if (host !== ALLOWED || (parseInt(port) || 443) !== ALLOWED_PORT) {
                        cltSocket.write("HTTP/1.1 403 Forbidden\r\n\r\n");
                        cltSocket.end();
                        return;
                      }
                      let established = false;
                      cltSocket.on("error", () => { cltSocket.destroy(); });
                      const srv = connect(ALLOWED_PORT, host, () => {
                        established = true;
                        cltSocket.write("HTTP/1.1 200 Connection Established\r\n\r\n");
                        srv.write(head);
                        srv.pipe(cltSocket);
                        cltSocket.pipe(srv);
                      });
                      srv.on("error", () => {
                        if (!established) cltSocket.write("HTTP/1.1 502 Bad Gateway\r\n\r\n");
                        cltSocket.destroy();
                      });
                    });
                    server.listen(3128, () => console.log("connect-proxy listening on :3128"));
            - complianceType: musthave
              objectDefinition:
                apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: insights-on-prem-connect-proxy
                  namespace: open-cluster-management
                  labels:
                    app: insights-on-prem-connect-proxy
                spec:
                  replicas: 1
                  selector:
                    matchLabels:
                      app: insights-on-prem-connect-proxy
                  template:
                    metadata:
                      labels:
                        app: insights-on-prem-connect-proxy
                    spec:
                      containers:
                        - name: proxy
                          image: registry.access.redhat.com/ubi9/nodejs-22-minimal@sha256:3ad547d444d597c68235bbb0e31dce0d1c0fa3f67c5c92474b7b3a05782b5a79
                          command: ["node", "/config/proxy.mjs"]
                          ports:
                            - containerPort: 3128
                          volumeMounts:
                            - name: script
                              mountPath: /config
                              readOnly: true
                          readinessProbe:
                            tcpSocket:
                              port: 3128
                            initialDelaySeconds: 2
                          livenessProbe:
                            tcpSocket:
                              port: 3128
                            initialDelaySeconds: 5
                          resources:
                            requests:
                              cpu: 1m
                              memory: 16Mi
                            limits:
                              memory: 32Mi
                          securityContext:
                            allowPrivilegeEscalation: false
                            capabilities:
                              drop: ["ALL"]
                            runAsNonRoot: true
                            readOnlyRootFilesystem: true
                            seccompProfile:
                              type: RuntimeDefault
                      volumes:
                        - name: script
                          configMap:
                            name: insights-on-prem-connect-proxy
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Service
                metadata:
                  name: insights-on-prem-connect-proxy
                  namespace: open-cluster-management
                  labels:
                    app: insights-on-prem-connect-proxy
                spec:
                  selector:
                    app: insights-on-prem-connect-proxy
                  ports:
                    - port: 3128
                      targetPort: 3128

    # --- NetworkPolicy: hub-only callers that also need the proxy ---
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: insights-operator-proxy-netpol-hub
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: mustonlyhave
              objectDefinition:
                apiVersion: networking.k8s.io/v1
                kind: NetworkPolicy
                metadata:
                  name: insights-operator-proxy-hub
                  namespace: openshift-insights
                spec:
                  podSelector:
                    matchLabels:
                      app: insights-operator-proxy
                  policyTypes:
                    - Ingress
                  ingress:
                    - from:
                        - namespaceSelector:
                            matchLabels:
                              kubernetes.io/metadata.name: open-cluster-management
                          podSelector:
                            matchLabels:
                              name: insights-client
                      ports:
                        - protocol: TCP
                          port: 8443
                    - from:
                        - namespaceSelector:
                            matchLabels:
                              kubernetes.io/metadata.name: open-cluster-management
                          podSelector:
                            matchLabels:
                              app: insights-on-prem-connect-proxy
                      ports:
                        - protocol: TCP
                          port: 8443

    # --- Console URP setting ---
    # The console backend reads settings from files in the console-config
    # ConfigMap (mounted at /app/config). Its config loader deletes any
    # UPGRADE_RISKS_PREDICTION_URL env var that lacks a matching file,
    # so the URL must be provided here rather than as an env var.
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: insights-on-prem-console-config
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: console-config
                  namespace: open-cluster-management
                data:
                  UPGRADE_RISKS_PREDICTION_URL: 'https://insights-operator-proxy.openshift-insights.svc:8443/api/insights-results-aggregator/v2/upgrade-risks-prediction'
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: insights-on-prem-hub-config
  namespace: insights-on-prem
placementRef:
  name: insights-on-prem-hub-only
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
subjects:
  - name: insights-on-prem-hub-config
    apiGroup: policy.open-cluster-management.io
    kind: Policy
