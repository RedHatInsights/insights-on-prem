apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: insights-on-prem-hub-config
  namespace: insights-on-prem
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    # --- Configure insights-client and console via MCH overrides ---
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: insights-on-prem-mch-overrides
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: operator.open-cluster-management.io/v1
                kind: MultiClusterHub
                metadata:
                  name: multiclusterhub
                  namespace: open-cluster-management
                spec:
                  overrides:
                    components:
                      - name: insights
                        enabled: true
                        configOverrides:
                          deployments:
                            - name: insights-client
                              containers:
                                - name: client
                                  env:
                                    - name: CCX_SERVER
                                      value: "https://insights-on-prem-proxy.insights-on-prem.svc.cluster.local:8443/api/v2"
                                    - name: SSL_CERT_DIR
                                      value: "/var/run/secrets/kubernetes.io/serviceaccount"
                                    - name: POLL_INTERVAL
                                      value: "1"

    # --- NetworkPolicy: hub-only callers that also need the proxy ---
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: insights-on-prem-proxy-netpol-hub
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: mustonlyhave
              objectDefinition:
                apiVersion: networking.k8s.io/v1
                kind: NetworkPolicy
                metadata:
                  name: insights-on-prem-proxy-hub
                  namespace: insights-on-prem
                spec:
                  podSelector:
                    matchLabels:
                      app: insights-on-prem-proxy
                  policyTypes:
                    - Ingress
                  ingress:
                    - from:
                        - namespaceSelector:
                            matchLabels:
                              kubernetes.io/metadata.name: open-cluster-management
                          podSelector:
                            matchLabels:
                              name: insights-client
                      ports:
                        - protocol: TCP
                          port: 8443
                    - from:
                        - namespaceSelector:
                            matchLabels:
                              kubernetes.io/metadata.name: open-cluster-management
                          podSelector:
                            matchLabels:
                              app: console-chart-v2
                              component: console
                      ports:
                        - protocol: TCP
                          port: 8443

    # --- Console URP setting ---
    # The console backend reads settings from files in the console-config
    # ConfigMap (mounted at /app/config). Its config loader deletes any
    # UPGRADE_RISKS_PREDICTION_URL env var that lacks a matching file,
    # so the URL must be provided here rather than as an env var.
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: insights-on-prem-console-config
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: console-config
                  namespace: open-cluster-management
                data:
                  UPGRADE_RISKS_PREDICTION_URL: 'https://insights-on-prem-proxy.insights-on-prem.svc:8443/api/insights-results-aggregator/v2/upgrade-risks-prediction'
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: insights-on-prem-hub-config
  namespace: insights-on-prem
placementRef:
  name: insights-on-prem-hub-only
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
subjects:
  - name: insights-on-prem-hub-config
    apiGroup: policy.open-cluster-management.io
    kind: Policy
