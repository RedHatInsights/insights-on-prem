apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: insights-operator-proxy
  namespace: insights-on-prem
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    # --- HAProxy ConfigMap ---
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: insights-operator-proxy-config
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: insights-operator-proxy-config
                  namespace: openshift-insights
                data:
                  haproxy.cfg: |
                    global
                        log stdout local0

                    defaults
                        mode http
                        log global
                        option httplog
                        timeout connect 5s
                        timeout client 30s
                        timeout server 30s

                    frontend proxy
                        bind *:8443 ssl crt /tmp/server.pem ssl-min-ver TLSv1.2
                        default_backend hub

                    backend hub
                        server hub {{hub (lookup "route.openshift.io/v1" "Route" "insights-on-prem" "insights-on-prem").spec.host hub}}:443 ssl crt /tmp/client.pem ca-file /certs/hub-ca/ca-bundle.crt verify required verifyhost {{hub (lookup "route.openshift.io/v1" "Route" "insights-on-prem" "insights-on-prem").spec.host hub}} sni str({{hub (lookup "route.openshift.io/v1" "Route" "insights-on-prem" "insights-on-prem").spec.host hub}}) ssl-min-ver TLSv1.2

    # --- proxy Service ---
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: insights-operator-proxy-service
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Service
                metadata:
                  name: insights-operator-proxy
                  namespace: openshift-insights
                  annotations:
                    service.beta.openshift.io/serving-cert-secret-name: insights-operator-proxy-tls
                spec:
                  selector:
                    app: insights-operator-proxy
                  ports:
                    - port: 8443
                      targetPort: 8443
                      protocol: TCP
                      name: https

    # --- Hub server CA (HAProxy verifies hub's server cert with this) ---
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: insights-operator-proxy-hub-ca
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: insights-operator-proxy-hub-ca
                  namespace: openshift-insights
                data:
                  ca-bundle.crt: |
                    {{hub fromConfigMap "insights-on-prem" "insights-on-prem-hub-ca" "ca-bundle.crt" | autoindent hub}}

    # --- Service CA trust (insights-operator trusts HAProxy's serving cert) ---
    # Merges the spoke's service-ca into the existing Proxy trustedCA ConfigMap
    # (if one exists) instead of overriding the reference. If no trustedCA is
    # configured, creates a new ConfigMap and sets the Proxy reference.
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: insights-operator-proxy-service-ca-trust
        spec:
          remediationAction: enforce
          severity: medium
          object-templates-raw: |
            {{- $ourCA := fromConfigMap "openshift-insights" "service-ca-bundle" "service-ca.crt" }}
            {{- $proxy := (lookup "config.openshift.io/v1" "Proxy" "" "cluster") }}
            {{- $cmName := $proxy.spec.trustedCA.name | default "" }}
            {{- if ne $cmName "" }}
              {{- $existing := fromConfigMap "openshift-config" $cmName "ca-bundle.crt" | default "" }}
              {{- if not (contains $ourCA $existing) }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: '{{ $cmName }}'
                  namespace: openshift-config
                data:
                  ca-bundle.crt: |
                    {{ $existing | autoindent }}
                    {{ $ourCA | autoindent }}
              {{- end }}
            {{- else if eq $cmName "" }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: insights-on-prem-proxy-ca-bundle
                  namespace: openshift-config
                data:
                  ca-bundle.crt: |
                    {{ $ourCA | autoindent }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: config.openshift.io/v1
                kind: Proxy
                metadata:
                  name: cluster
                spec:
                  trustedCA:
                    name: insights-on-prem-proxy-ca-bundle
            {{- end }}


    # --- NetworkPolicy: only insights-operator can reach the proxy ---
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: insights-operator-proxy-netpol
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: mustonlyhave
              objectDefinition:
                apiVersion: networking.k8s.io/v1
                kind: NetworkPolicy
                metadata:
                  name: insights-operator-proxy
                  namespace: openshift-insights
                spec:
                  podSelector:
                    matchLabels:
                      app: insights-operator-proxy
                  policyTypes:
                    - Ingress
                  ingress:
                    - from:
                        - podSelector:
                            matchLabels:
                              app: insights-operator
                      ports:
                        - protocol: TCP
                          port: 8443

    # --- Insights Operator configuration ---
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: insights-operator-proxy-operator-config
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: insights-config
                  namespace: openshift-insights
                data:
                  config.yaml: |
                    dataReporting:
                      uploadEndpoint: https://insights-operator-proxy.openshift-insights.svc:8443/api/ingress/v1/upload
                      downloadEndpoint: https://insights-operator-proxy.openshift-insights.svc:8443/api/v2/cluster/%s/reports
                      downloadEndpointTechPreview: https://insights-operator-proxy.openshift-insights.svc:8443/api/v2/cluster/%s/request/%s/report
                      processingStatusEndpoint: https://insights-operator-proxy.openshift-insights.svc:8443/api/v2/cluster/%s/request/%s/status
                      interval: 0h1m0s
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: insights-operator-proxy
  namespace: insights-on-prem
placementRef:
  name: all-managed-clusters
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
subjects:
  - name: insights-operator-proxy
    apiGroup: policy.open-cluster-management.io
    kind: Policy
