apiVersion: apps/v1
kind: Deployment
metadata:
  name: insights-on-prem
  namespace: insights-on-prem-poc
spec:
  replicas: 1
  template:
    metadata:
      name: insights-on-prem
      labels:
        app: insights-on-prem
    spec:
      terminationGracePeriodSeconds: 300
      serviceAccountName: insights-on-prem
      containers:
      - name: insights-on-prem
        image: quay.io/ccxdev/insights-on-premise-poc:latest
        ports:
        - containerPort: 8443
          name: https
          protocol: TCP
        readinessProbe:
          tcpSocket:
            port: 8443
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: server-cert
          mountPath: /tls
          readOnly: true
        - name: client-ca
          mountPath: /tls/client-ca
          readOnly: true
        env:
        - name: MTLS_ENABLED
          value: "true"
        - name: POSTGRES_HOST
          value: "insights-postgres"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: insights-postgres
              key: database-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: insights-postgres
              key: database-password
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: insights-postgres
              key: database-name
      volumes:
      - name: server-cert
        secret:
          secretName: insights-on-prem-server-tls
      - name: client-ca
        secret:
          secretName: insights-on-prem-client-ca
          items:
          - key: tls.crt
            path: ca.crt
      imagePullSecrets:
      - name: ccxdev-insights-on-prem-poc-pull-secret
  selector:
    matchLabels:
      app: insights-on-prem
