apiVersion: addon.open-cluster-management.io/v1alpha1
kind: AddOnTemplate
metadata:
  name: insights-on-prem-proxy
spec:
  addonName: insights-on-prem-proxy
  registration:
    - type: CustomSigner
      customSigner:
        signerName: open-cluster-management.io/insights-on-prem-signer
        subject:
          user: managed-cluster-observability
          groups:
            - system:open-cluster-management:insights-on-prem-proxy
        signingCA:
          namespace: insights-on-prem
          name: insights-on-prem-client-ca
  agentSpec:
    workload:
      manifests:
        - apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: insights-on-prem-proxy
            namespace: insights-on-prem
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: insights-on-prem-proxy
            template:
              metadata:
                labels:
                  app: insights-on-prem-proxy
              spec:
                containers:
                  - name: haproxy
                    image: registry.redhat.io/openshift4/ose-haproxy-router-rhel9:v4.16
                    securityContext:
                      capabilities:
                        add:
                          - NET_BIND_SERVICE
                    command: ["sh", "-c"]
                    args:
                      - |
                        cat /certs/server/tls.crt /certs/server/tls.key > /tmp/server.pem &&
                        cat /managed/open-cluster-management.io-insights-on-prem-signer/tls.crt /managed/open-cluster-management.io-insights-on-prem-signer/tls.key > /tmp/client.pem &&
                        sha256sum /certs/server/tls.crt /managed/open-cluster-management.io-insights-on-prem-signer/tls.crt /certs/hub-ca/ca-bundle.crt > /tmp/.cert-hash &&
                        haproxy -f /usr/local/etc/haproxy/haproxy.cfg
                    resources:
                      requests:
                        cpu: 100m
                        memory: 128Mi
                      limits:
                        cpu: 300m
                        memory: 512Mi
                    ports:
                      - containerPort: 8443
                        protocol: TCP
                    readinessProbe:
                      tcpSocket:
                        port: 8443
                      initialDelaySeconds: 5
                      periodSeconds: 10
                    # Restarts the pod when cert SHA changes, as
                    # HAProxy cannot hot-reload certificates.
                    livenessProbe:
                      exec:
                        command: ["sh", "-c", "sha256sum -c /tmp/.cert-hash"]
                      initialDelaySeconds: 10
                      periodSeconds: 30
                    volumeMounts:
                      - name: server-cert
                        mountPath: /certs/server
                        readOnly: true
                      - name: hub-ca
                        mountPath: /certs/hub-ca
                        readOnly: true
                      - name: haproxy-config
                        mountPath: /usr/local/etc/haproxy
                        readOnly: true
                volumes:
                  - name: server-cert
                    secret:
                      secretName: insights-on-prem-proxy-tls
                  - name: hub-ca
                    configMap:
                      name: insights-on-prem-proxy-hub-ca
                  - name: haproxy-config
                    configMap:
                      name: insights-on-prem-proxy-config
